<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Маршрут по легенде</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html,body{margin:0;height:100%;background:#0d1117;color:#e8edf2;font:14px -apple-system,system-ui,Roboto,sans-serif}
  #map{position:absolute;inset:0 0 0 0}
  .lbl{background:#58a6ff;color:#04101f;border-radius:10px;padding:1px 6px;font:700 12px ui-monospace,Menlo,monospace;white-space:nowrap;border:1px solid #04101f}
  .lbl.bad{background:#e3b341}
  #box{position:absolute;left:8px;right:8px;bottom:8px;z-index:1000;background:#161b22ee;border:1px solid #2a313c;border-radius:10px;padding:8px 10px;max-height:38%;overflow:auto}
  #box table{border-collapse:collapse;width:100%;font:12px ui-monospace,Menlo,monospace}
  #box td{padding:2px 4px;border-bottom:1px solid #2a313c}
</style>
</head>
<body>
<div id="map"></div>
<div id="box"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/*DATA*/
const map = L.map("map");
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19, attribution: "© OpenStreetMap"}).addTo(map);
const line = L.polyline(ROUTE, {color: "#f85149", weight: 5, opacity: .85}).addTo(map);
L.circleMarker(START, {radius: 7, color: "#3fb950", fillOpacity: 1}).addTo(map).bindTooltip("старт (заданная точка)");
for (const m of MARKS) {
  const bad = Math.abs(m.derr) > 40 || m.aerr > 30;
  L.marker(m.ll, {icon: L.divIcon({className: "", html: `<span class="lbl${bad ? " bad" : ""}">${m.n}</span>`})})
    .addTo(map).bindPopup(`п.${m.n} · км ${m.km.toFixed(2)}<br>${m.act}<br>расст. ${m.derr > 0 ? "+" : ""}${m.derr} м, угол ±${m.aerr}°`);
}
map.fitBounds(line.getBounds().pad(0.15));
document.getElementById("box").innerHTML = `<b>${TITLE}</b> — красное: маршрут, жёлтые номера: пункты с заметным расхождением<table>` +
  MARKS.map(m => `<tr><td>п.${m.n}</td><td>${m.km.toFixed(2)}</td><td>${m.act}</td><td>${m.derr > 0 ? "+" : ""}${m.derr} м</td><td>±${m.aerr}°</td></tr>`).join("") + "</table>";
</script>
</body>
</html>
